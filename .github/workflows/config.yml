name: Emacs configuration

on: [push, pull_request]

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # setup-emacs exposes the Emacs 31 branch as release-snapshot.
        emacs: ['30.2', release-snapshot]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}
      - name: Smoke
        run: bash test/run-config-tests.sh