name: Emacs configuration

on: [push, pull_request]

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # setup-emacs exposes the Emacs 31 branch as release-snapshot.
        emacs: ['30.2', release-snapshot]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}
      - uses: actions/cache@v6
        with:
          path: .cache/test-packages
          # Bump the vN prefix whenever a package is REMOVED from the config.
          # restore-keys deliberately falls back to the cache from an older
          # systemhalted.org, which is what keeps most runs fast -- but it also
          # restores packages the config has since dropped, and
          # systemhalted/web-stack-uses-builtin-tree-sitter-modes asserts that
          # typescript-mode, rjsx-mode and js2-mode are absent.  v2 drops the
          # caches still carrying typescript-mode from before the tree-sitter
          # switch.
          key: packages-v2-${{ runner.os }}-${{ matrix.emacs }}-${{ hashFiles('systemhalted.org') }}
          restore-keys: |
            packages-v2-${{ runner.os }}-${{ matrix.emacs }}-
      - name: Load, regressions, installer, and tangling
        run: bash test/run-config-tests.sh smoke ert installer tangle
      - name: Compiler diagnostics
        run: bash test/run-config-tests.sh compile
      - name: Terminal startup and Git client handoff
        run: bash test/run-config-tests.sh daemon interactive
